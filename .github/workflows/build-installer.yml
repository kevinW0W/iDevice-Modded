name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Others
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - name: Install artwork build dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            winget install --exact --id JRSoftware.InnoSetup --silent `
              --accept-package-agreements --accept-source-agreements
          }
      - name: Build installer
        run: python tools/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: iDesktop-Windows-x64-Installer
          path: Others/dist/iDesktop-Setup-*-x64.exe
          if-no-files-found: error
      - name: Publish the installer to the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match pyproject.toml version v$version."
          }
          gh release create "$env:GITHUB_REF_NAME" "dist\iDesktop-Setup-$version-x64.exe" `
            --title "iDesktop $version" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
