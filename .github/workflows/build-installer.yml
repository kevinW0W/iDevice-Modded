name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to replace its installer asset; leave blank to build only.
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Others
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - name: Install artwork build dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            winget install --exact --id JRSoftware.InnoSetup --silent `
              --accept-package-agreements --accept-source-agreements
          }
      - name: Build installer
        run: python tools/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: iDevice-Modded-Windows-x64-Installer
          path: Others/dist/iDevice-Modded-Setup-*-x64.exe
          if-no-files-found: error
      - name: Publish the installer to the tagged release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $targetTag = $env:GITHUB_REF_NAME
          } else {
            $targetTag = "${{ inputs.release_tag }}"
          }
          if ($targetTag -ne "v$version") {
            throw "Release tag $targetTag must match pyproject.toml version v$version."
          }
          $installer = "dist\iDevice-Modded-Setup-$version-x64.exe"
          $releaseNotes = @"
          ![iDevice Modded](https://raw.githubusercontent.com/kevinW0W/iDevice-Modded/v$version/Others/assets/release-banner.png)

          # iDevice Modded $version

          ## Downloads
          - **Windows x64 installer:** [iDevice-Modded-Setup-$version-x64.exe](https://github.com/kevinW0W/iDevice-Modded/releases/download/v$version/iDevice-Modded-Setup-$version-x64.exe)
          - **Optional WebDriverAgent:** [Unsigned IPA](https://github.com/kevinW0W/iDevice-Modded/releases/download/v0.1.1/WebDriverAgent-16.12.8-unsigned.ipa) · [BSD-3-Clause license](https://github.com/kevinW0W/iDevice-Modded/releases/download/v0.1.1/WebDriverAgent-BSD-3-Clause-LICENSE.txt)

          ## What's Fixed
          - The splash and Edge mirror remember their last positions and are moved back onto a connected display if monitor layouts change.
          - The startup splash uses custom draggable window chrome with custom minimize and close buttons; its taskbar button restores it while startup continues.
          - Start Menu and desktop shortcuts launch the windowless Python runtime directly; the extra VBS launcher has been removed.
          - The floating mirror stays minimized until you restore it; periodic layout updates no longer bring the window back.
          - The Windows installer UI and setup branding use iDevice Modded.

          ## Features
          - iPhone mirroring and controls over USB or paired Wi-Fi.
          - Centered movable startup splash, hidden shortcut launch, and landscape-aware scrolling.
          - Floating view, screenshots, clipboard sync, and optional WebDriverAgent automation.
          - Pro Notch on/off toggle with orientation-aware floating controls.

          **Requirements:** 64-bit Windows 10 (1809+) or Windows 11; HD mirroring requires iOS 27+ and HEVC decoding. See the [full guide](https://github.com/kevinW0W/iDevice-Modded/blob/v$version/Others/README.md) and [troubleshooting guide](https://github.com/kevinW0W/iDevice-Modded/blob/v$version/Others/Q_A.md).

          This is an attributed GPL-3.0-or-later fork of [realxhabib/iDesktop](https://github.com/realxhabib/iDesktop).
          "@
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            gh release create "$targetTag" "$installer" --title "iDevice Modded $version" --notes $releaseNotes
          } else {
            $assets = gh release view "$targetTag" --json assets --jq '.assets[].name'
            if ($LASTEXITCODE -ne 0) {
              throw "Could not read release $targetTag."
            }
            foreach ($oldAsset in @("iDesktop-Setup-$version-x64.exe", "iDevice-Modded-Setup-$version-x64.exe")) {
              if ($assets -contains $oldAsset) {
                gh release delete-asset "$targetTag" "$oldAsset" --yes
                if ($LASTEXITCODE -ne 0) {
                  throw "Could not remove the old installer asset $oldAsset."
                }
              }
            }
            gh release upload "$targetTag" "$installer"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload the updated installer to $targetTag."
            }
            $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
            [IO.File]::WriteAllText($notesPath, $releaseNotes)
            gh release edit "$targetTag" --title "iDevice Modded $version" --notes-file $notesPath
          }
        env:
          GH_TOKEN: ${{ github.token }}
