name: Fix v0.1.7 release branding

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-v017-release-branding.yml"

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Apply the iDevice Modded release layout
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ![iDevice Modded](https://raw.githubusercontent.com/kevinW0W/iDevice-Modded/v0.1.7/Others/assets/release-banner.png)

          # iDevice Modded 0.1.7

          ## Downloads
          - **Windows x64 installer:** [iDesktop-Setup-0.1.7-x64.exe](https://github.com/kevinW0W/iDevice-Modded/releases/download/v0.1.7/iDesktop-Setup-0.1.7-x64.exe)
          - **Optional WebDriverAgent:** [Unsigned IPA](https://github.com/kevinW0W/iDevice-Modded/releases/download/v0.1.1/WebDriverAgent-16.12.8-unsigned.ipa) · [BSD-3-Clause license](https://github.com/kevinW0W/iDevice-Modded/releases/download/v0.1.1/WebDriverAgent-BSD-3-Clause-LICENSE.txt)

          ## What's fixed
          - The floating mirror stays minimized until you restore it; periodic layout updates no longer bring the window back.

          ## Features
          - iPhone mirroring and controls over USB or paired Wi-Fi.
          - Centered movable startup splash, hidden shortcut launch, and landscape-aware scrolling.
          - Floating view, screenshots, clipboard sync, and optional WebDriverAgent automation.
          - Pro Notch on/off toggle with orientation-aware floating controls.

          **Requirements:** 64-bit Windows 10 (1809+) or Windows 11; HD mirroring requires iOS 27+ and HEVC decoding. See the [full guide](https://github.com/kevinW0W/iDevice-Modded/blob/v0.1.7/Others/README.md) and [troubleshooting guide](https://github.com/kevinW0W/iDevice-Modded/blob/v0.1.7/Others/Q_A.md).

          This is an attributed GPL-3.0-or-later fork of [realxhabib/iDesktop](https://github.com/realxhabib/iDesktop).
          EOF
          gh release edit v0.1.7 --title "iDevice Modded 0.1.7" --notes-file "$RUNNER_TEMP/release-notes.md"
