name: Rebuild branded v0.1.7 installer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-v017-installer.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Build and replace the v0.1.7 installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build-installer.yml --ref main --field release_tag=v0.1.7
