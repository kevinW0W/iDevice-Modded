name: Sign WebDriverAgent IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Others
    steps:
      - uses: actions/checkout@v4

      - name: Download WebDriverAgent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wda"
          curl --fail --location --retry 3 \
            "https://github.com/appium/WebDriverAgent/releases/download/v16.12.8/WebDriverAgentRunner-Runner.zip" \
            --output "$RUNNER_TEMP/wda.zip"
          unzip -q "$RUNNER_TEMP/wda.zip" -d "$RUNNER_TEMP/wda"
          test -d "$RUNNER_TEMP/wda/WebDriverAgentRunner-Runner.app"

      - name: Sign and package IPA
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          : "${APPLE_CERTIFICATE_BASE64:?Set the APPLE_CERTIFICATE_BASE64 Actions secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set the APPLE_CERTIFICATE_PASSWORD Actions secret}"
          : "${APPLE_PROVISIONING_PROFILE_BASE64:?Set the APPLE_PROVISIONING_PROFILE_BASE64 Actions secret}"
          : "${APPLE_SIGNING_IDENTITY:?Set the APPLE_SIGNING_IDENTITY Actions secret}"
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID Actions secret}"

          WORK="$RUNNER_TEMP/wda-signing"
          KEYCHAIN="$WORK/signing.keychain-db"
          APP="$RUNNER_TEMP/wda/WebDriverAgentRunner-Runner.app"
          PROFILE="$WORK/profile.mobileprovision"
          PROFILE_PLIST="$WORK/profile.plist"
          ENTITLEMENTS="$WORK/entitlements.plist"
          OUTPUT="$GITHUB_WORKSPACE/Others/iPA Sign web agent/WebDriverAgent-signed.ipa"
          mkdir -p "$WORK" "$(dirname "$OUTPUT")"

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$WORK/certificate.p12"
          security import "$WORK/certificate.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" |
            grep -Fq "\"$APPLE_SIGNING_IDENTITY\"" || {
              echo "The configured signing identity was not found in the imported certificate."
              exit 1
            }

          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE"
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' "$PROFILE_PLIST" >/dev/null
          if [[ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" || "$PROFILE_APP_ID" != "$APPLE_TEAM_ID".* ]]; then
            echo "The provisioning profile must belong to APPLE_TEAM_ID and cover the WDA app."
            exit 1
          fi
          APP_ID_PATTERN="${PROFILE_APP_ID#"$APPLE_TEAM_ID".}"
          if [[ ! "$BUNDLE_ID" == $APP_ID_PATTERN ]]; then
            echo "The provisioning profile does not match the WDA bundle identifier: $BUNDLE_ID"
            exit 1
          fi

          cp "$PROFILE" "$APP/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$PROFILE_PLIST" > "$ENTITLEMENTS"
          codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" --generate-entitlement-der \
            --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          python3 tools/make_ipa.py "$APP" "$OUTPUT"
          python3 -c 'import sys, zipfile; expected = "Payload/WebDriverAgentRunner-Runner.app/PlugIns/WebDriverAgentRunner.xctest/Info.plist"; names = zipfile.ZipFile(sys.argv[1]).namelist(); assert expected in names, "The WebDriverAgent XCTest plugin is missing from the IPA"' "$OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-signed-IPA
          path: Others/iPA Sign web agent/WebDriverAgent-signed.ipa
          if-no-files-found: error
          retention-days: 7
